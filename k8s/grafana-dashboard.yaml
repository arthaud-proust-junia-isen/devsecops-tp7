# Le sidecar de Grafana charge tout ConfigMap du namespace qui porte grafana_dashboard: "1"
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fastapi.json: |
    {
      "title": "FastAPI",
      "uid": "fastapi",
      "schemaVersion": 37,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "Requêtes totales",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [{ "expr": "sum(http_requests_total{job=\"fastapi-app\"})" }]
        },
        {
          "type": "stat",
          "title": "Pods scrapés (up)",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(up{job=\"fastapi-app\"})" }]
        },
        {
          "type": "timeseries",
          "title": "Taux d'erreurs (4xx + 5xx)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [{
            "expr": "(sum(rate(http_requests_total{job=\"fastapi-app\",status=~\"[45]..\"}[1m])) or vector(0)) / sum(rate(http_requests_total{job=\"fastapi-app\"}[1m]))",
            "legendFormat": "erreurs"
          }]
        },
        {
          "type": "timeseries",
          "title": "Requêtes par seconde",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [{
            "expr": "sum by (method, path, status) (rate(http_requests_total{job=\"fastapi-app\"}[1m]))",
            "legendFormat": "{{method}} {{path}} {{status}}"
          }]
        },
        {
          "type": "timeseries",
          "title": "Latence P95",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{job=\"fastapi-app\"}[5m])))",
            "legendFormat": "{{path}}"
          }]
        }
      ]
    }
